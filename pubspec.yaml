name: merkez_strateji_ve_roguelike
description: "Strateji ve Roguelike merkez uygulaması. Offline-first Flutter game for Android, iOS and Web."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Ortak çekirdek: https://github.com/taktemurr-ops/studio-core
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 25c9e5cb2167cce4b7f65f57a214aacd9b2c1732
  # Merkezdeki oyunlar (her biri kendi deposunda)
  oyun_zindan_kesfi:
    git:
      url: https://github.com/taktemurr-ops/oyun-zindan-kesfi
      ref: 7b685e451b99543772a944a81bdd7724478ff018
  oyun_deste_kurma:
    git:
      url: https://github.com/taktemurr-ops/oyun-deste-kurma
      ref: d44b3bc1c77e84b310a42c1d4d6f0b57be250ed0
  oyun_hayatta_kalma:
    git:
      url: https://github.com/taktemurr-ops/oyun-hayatta-kalma
      ref: 462b425cfa1af9ce32e6a49eaf15f5df15080896
  oyun_zar_macerasi:
    git:
      url: https://github.com/taktemurr-ops/oyun-zar-macerasi
      ref: 03d20f47d2ac27b400db5e9eeaead3c62c4682d6
  oyun_altigen_savas_oyunu:
    git:
      url: https://github.com/taktemurr-ops/oyun-altigen-savas-oyunu
      ref: 126adda9bd803f0672ed2a563fa6eb24b87ffc83
  oyun_sira_tabanli_taktik:
    git:
      url: https://github.com/taktemurr-ops/oyun-sira-tabanli-taktik
      ref: 59e5dc606dd50cfe840740b931254731cb75a58f
  oyun_kum_saati_arenasi:
    git:
      url: https://github.com/taktemurr-ops/oyun-kum-saati-arenasi
      ref: d512f33b365b6c5d878f05e1cb3347359c24d9c6
  oyun_vadi_kurucu:
    git:
      url: https://github.com/taktemurr-ops/oyun-vadi-kurucu
      ref: 8d4498e05e5375cf62b7cf0bea855874fec9fd28
  oyun_dort_mevsim_krallik:
    git:
      url: https://github.com/taktemurr-ops/oyun-dort-mevsim-krallik
      ref: 5dab0db5e6ea0671aae78dd2d92574edd86cca33
  oyun_harita_defteri:
    git:
      url: https://github.com/taktemurr-ops/oyun-harita-defteri
      ref: e26b462fcb639cde188ab35a7175b654ebb8b21d
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.5.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.2.0

dependency_overrides:
  # Tüm oyunlar aynı çekirdek ve motor sürümlerini kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 25c9e5cb2167cce4b7f65f57a214aacd9b2c1732
  strateji_motoru:
    git:
      url: https://github.com/taktemurr-ops/strateji-motoru
      ref: 1c6bc9be1eaddc858a6d5c4ba40f392a5647b2ee

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/approved/
    - assets/sfx/
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1F2A44"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1F2A44"
    theme_color: "#1F2A44"

flutter_native_splash:
  color: "#1F2A44"
  image: assets/branding/splash.png
  android_12:
    color: "#1F2A44"
    image: assets/branding/splash_android12.png
  web: true
