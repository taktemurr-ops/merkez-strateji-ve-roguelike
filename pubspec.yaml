name: merkez_strateji_ve_roguelike
description: "Strateji ve Roguelike merkez uygulaması. Offline-first Flutter game for Android, iOS and Web."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Ortak çekirdek: https://github.com/taktemurr-ops/studio-core
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: a2d05c02f4fa6a3fa8fe9a28a1d19578c0d9b1ec
  # Merkezdeki oyunlar (her biri kendi deposunda)
  oyun_zindan_kesfi:
    git:
      url: https://github.com/taktemurr-ops/oyun-zindan-kesfi
      ref: 5bce4328ce2a094826aa3e905f86aec61f0b786e
  oyun_deste_kurma:
    git:
      url: https://github.com/taktemurr-ops/oyun-deste-kurma
      ref: 3ae45e4657b271514ec2c85cf3f413ccd22060cd
  oyun_hayatta_kalma:
    git:
      url: https://github.com/taktemurr-ops/oyun-hayatta-kalma
      ref: 201197c77a29745bff4c144f6137720c631d90b5
  oyun_zar_macerasi:
    git:
      url: https://github.com/taktemurr-ops/oyun-zar-macerasi
      ref: 0dddb84d1026433ecaf7aca290b58d632b95f1b1
  oyun_altigen_savas_oyunu:
    git:
      url: https://github.com/taktemurr-ops/oyun-altigen-savas-oyunu
      ref: 6e67e04298ccdb4590004f96e72642b6259135bd
  oyun_sira_tabanli_taktik:
    git:
      url: https://github.com/taktemurr-ops/oyun-sira-tabanli-taktik
      ref: 6e3952e3cb06f2cc29428ad2cc08fd222ea36cc4
  oyun_otomatik_savasci:
    git:
      url: https://github.com/taktemurr-ops/oyun-otomatik-savasci
      ref: 38a7969fc475d3fb7edd6f74627cd46c17e47d51
  oyun_zindan_ustasi:
    git:
      url: https://github.com/taktemurr-ops/oyun-zindan-ustasi
      ref: 18e99be8ea7801875c6675bb6b230ab95a074368
  oyun_kum_saati_arenasi:
    git:
      url: https://github.com/taktemurr-ops/oyun-kum-saati-arenasi
      ref: d9df18aa961960752e9e060c888924734f851adc
  oyun_vadi_kurucu:
    git:
      url: https://github.com/taktemurr-ops/oyun-vadi-kurucu
      ref: 817bd0ba3c2fa5c58fd5ca96e3badd02da6da4aa
  oyun_dort_mevsim_krallik:
    git:
      url: https://github.com/taktemurr-ops/oyun-dort-mevsim-krallik
      ref: c9ae281ad35f3b6cd6f26bc75d99eeebeabae41b
  oyun_harita_defteri:
    git:
      url: https://github.com/taktemurr-ops/oyun-harita-defteri
      ref: 8ad3d485e86fbfc48942822c496efc12d37a7a89
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2
  audioplayers: ^6.5.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.2.0

dependency_overrides:
  # Tüm oyunlar aynı çekirdek ve motor sürümlerini kullansın.
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: a2d05c02f4fa6a3fa8fe9a28a1d19578c0d9b1ec
  strateji_motoru:
    git:
      url: https://github.com/taktemurr-ops/strateji-motoru
      ref: 38fb4a2b7bab710b687caaec9b26bd1742090cce

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/approved/
    - assets/sfx/
    - assets/config/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#1F2A44"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#1F2A44"
    theme_color: "#1F2A44"

flutter_native_splash:
  color: "#1F2A44"
  image: assets/branding/splash.png
  android_12:
    color: "#1F2A44"
    image: assets/branding/splash_android12.png
  web: true
